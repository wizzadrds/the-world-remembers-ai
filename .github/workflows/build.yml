name: Build and Minecraft smoke test

on:
  push:
    branches: [ main, restore/full-simulation-and-voice-ui ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile and test
        run: gradle build
      - name: Prepare release artifact
        shell: bash
        run: |
          set -e
          mkdir -p artifact
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-gametest.jar' -print | sort)
          if [ ${#jars[@]} -ne 1 ]; then
            echo "Expected exactly one distributable mod JAR, found ${#jars[@]}."
            printf '%s\\n' "${jars[@]}"
            find build/libs -maxdepth 1 -type f -printf '%f\\n' | sort || true
            exit 1
          fi
          cp "${jars[0]}" artifact/
          sha256sum artifact/*.jar > artifact/SHA256SUMS.txt
          test -s artifact/*.jar
          unzip -t artifact/*.jar
          ls -lah artifact/

      - name: Upload release candidate JAR
        uses: actions/upload-artifact@v4
        with:
          name: the-world-remembers-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false
          retention-days: 14

      - name: Store build and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.sha }}
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/run/**/*.log
            server.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare server EULA
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
      - name: Start Fabric server smoke test
        shell: bash
        run: |
          set -e
          rm -f server.log
          gradle runServer > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..120}; do
            if grep -q "The World Remembers" server.log; then
              echo "Mod initialization detected."
              exit 0
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              cat server.log
              exit 1
            fi
            sleep 2
          done
          cat server.log
          echo "Fabric server did not initialize the mod within the smoke-test window."
          exit 1

  client-game-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run Fabric client GameTests
        run: xvfb-run -a gradle runClientGameTest
